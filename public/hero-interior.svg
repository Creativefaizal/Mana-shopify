<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A calm modern living room">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efefef" /><stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb" /><stop offset="1" stop-color="#e6e6e6" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdcdcd" /><stop offset="1" stop-color="#b3b3b3" />
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c3c" /><stop offset="1" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2b8" /><stop offset="1" stop-color="#e6c98d" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)" />

  <!-- right window wall -->
  <rect x="1040" y="90" width="470" height="520" rx="10" fill="#dcdcdc" />
  <rect x="1058" y="108" width="434" height="484" fill="url(#glass)" />
  <rect x="1268" y="108" width="12" height="484" fill="#c4c4c4" />
  <rect x="1058" y="342" width="434" height="12" fill="#c4c4c4" />
  <path d="M1058 420h434v172h-434z" fill="#e8e8e8" opacity="0.75" />
  <path d="M1058 470h434v122h-434z" fill="#dcdcdc" opacity="0.7" />

  <!-- far shelving -->
  <rect x="120" y="150" width="300" height="420" rx="8" fill="#e4e4e4" />
  <rect x="140" y="170" width="260" height="380" fill="#f4f4f4" />
  <path d="M140 250h260M140 330h260M140 410h260M140 490h260" stroke="#d5d5d5" stroke-width="10" />
  <g fill="#b9b9b9">
    <rect x="164" y="200" width="40" height="50" rx="6" />
    <rect x="222" y="184" width="54" height="66" rx="8" />
    <rect x="300" y="212" width="34" height="38" rx="5" />
    <ellipse cx="356" cy="234" rx="26" ry="16" />
    <rect x="170" y="290" width="66" height="40" rx="6" />
    <rect x="256" y="282" width="46" height="48" rx="8" />
    <circle cx="344" cy="306" r="18" />
    <rect x="150" y="452" width="120" height="38" rx="6" />
    <rect x="292" y="440" width="88" height="50" rx="8" />
  </g>

  <!-- framed artwork -->
  <rect x="500" y="150" width="220" height="160" rx="6" fill="#d9d9d9" />
  <rect x="512" y="162" width="196" height="136" fill="#eeeeee" />
  <path d="M512 262l58-52 44 38 40-34 54 48v36H512z" fill="#c9c9c9" />
  <circle cx="656" cy="196" r="14" fill="#bdbdbd" />

  <!-- console + screens -->
  <rect x="500" y="360" width="470" height="18" rx="4" fill="#c6c6c6" />
  <rect x="770" y="378" width="180" height="130" rx="8" fill="#2b2b2b" />
  <rect x="786" y="392" width="148" height="102" rx="6" fill="#4a4a4a" />
  <path d="M786 470l46-42 34 30 30-26 38 34v26H786z" fill="#6f6f6f" />
  <rect x="840" y="508" width="40" height="14" fill="#3a3a3a" />
  <rect x="556" y="386" width="180" height="76" rx="6" fill="#d2d2d2" />
  <rect x="572" y="402" width="120" height="10" rx="5" fill="#b4b4b4" />
  <rect x="572" y="422" width="148" height="10" rx="5" fill="#bcbcbc" />
  <rect x="572" y="442" width="96" height="10" rx="5" fill="#c2c2c2" />

  <!-- floor -->
  <rect y="520" width="1600" height="380" fill="url(#floor)" />
  <path d="M0 620h1600M0 720h1600M0 820h1600" stroke="#a7a7a7" stroke-width="3" opacity="0.5" />
  <path d="M240 520v380M520 520v380M820 520v380M1120 520v380M1380 520v380" stroke="#a7a7a7" stroke-width="3" opacity="0.35" />

  <!-- rug -->
  <ellipse cx="820" cy="760" rx="520" ry="120" fill="#dcdcdc" opacity="0.85" />
  <ellipse cx="820" cy="760" rx="440" ry="96" fill="#e6e6e6" opacity="0.8" />

  <!-- sofa -->
  <rect x="420" y="590" width="620" height="180" rx="34" fill="url(#sofa)" />
  <rect x="400" y="620" width="60" height="150" rx="28" fill="#333333" />
  <rect x="1000" y="620" width="60" height="150" rx="28" fill="#333333" />
  <rect x="470" y="560" width="250" height="70" rx="22" fill="#454545" />
  <rect x="740" y="560" width="250" height="70" rx="22" fill="#454545" />
  <rect x="470" y="660" width="620" height="40" rx="18" fill="#2c2c2c" />
  <path d="M520 770v34M900 770v34" stroke="#1c1c1c" stroke-width="14" stroke-linecap="round" />

  <!-- cushions -->
  <rect x="560" y="586" width="120" height="80" rx="18" fill="#eaeaea" />
  <rect x="780" y="586" width="120" height="80" rx="18" fill="#d6d6d6" />

  <!-- coffee table -->
  <ellipse cx="820" cy="812" rx="210" ry="34" fill="#b4b4b4" />
  <ellipse cx="820" cy="800" rx="210" ry="34" fill="#d0d0d0" />
  <path d="M640 812v42M1000 812v42" stroke="#a3a3a3" stroke-width="12" stroke-linecap="round" />
  <rect x="768" y="778" width="72" height="14" rx="6" fill="#9f9f9f" />
  <circle cx="900" cy="782" r="12" fill="#c2c2c2" />

  <!-- floor lamp -->
  <ellipse cx="1268" cy="808" rx="58" ry="16" fill="#c4c4c4" />
  <path d="M1268 800V560" stroke="#9c9c9c" stroke-width="8" />
  <path d="M1220 520h96l-16 48h-64z" fill="url(#warm)" />
  <path d="M1236 566h64" stroke="#e0c489" stroke-width="6" />

  <!-- plant -->
  <path d="M180 800h96l-12 60h-72z" fill="#cfcfcf" />
  <path d="M228 800V700" stroke="#9c9c9c" stroke-width="6" />
  <path d="M228 720c-40-10-64-40-62-72 34 6 58 32 62 72zM228 720c40-10 64-40 62-72-34 6-58 32-62 72zM228 748c-30-6-48-28-48-52 26 4 44 24 48 52z" fill="#bdbdbd" />

  <!-- soft light from the window -->
  <path d="M1058 108h434v120h-434z" fill="#ffffff" opacity="0.35" />
</svg>
